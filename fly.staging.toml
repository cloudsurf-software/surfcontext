app = 'surfcontext-staging'
primary_region = 'sjc'

[build]

[env]
  RUST_LOG = 'debug'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = '5s'
  interval = '30s'
  method = 'GET'
  path = '/'
  timeout = '5s'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
