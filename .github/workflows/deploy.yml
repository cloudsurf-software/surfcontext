name: Deploy

on:
  push:
    branches: [main, staging, develop]

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    if: github.ref_name != 'develop'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test

  deploy:
    name: Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    environment: ${{ github.ref_name == 'main' && 'production' || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Deploy to develop
        if: github.ref_name == 'develop'
        run: flyctl deploy --config fly.develop.toml --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to staging
        if: github.ref_name == 'staging'
        run: flyctl deploy --config fly.staging.toml --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to production
        if: github.ref_name == 'main'
        run: flyctl deploy --config fly.production.toml --remote-only --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  smoke-test:
    name: Smoke test (${{ github.ref_name }})
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref_name == 'develop' || github.ref_name == 'staging' || github.ref_name == 'main'
    steps:
      - uses: actions/checkout@v4

      - name: Set target URL
        id: url
        run: |
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "target=https://surfcontext.org" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_name }}" = "develop" ]; then
            echo "target=https://surfcontext-develop.fly.dev" >> "$GITHUB_OUTPUT"
          else
            echo "target=https://surfcontext-staging.fly.dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for deploy health
        run: |
          echo "Waiting for ${{ steps.url.outputs.target }} to be healthy..."
          for i in $(seq 1 12); do
            if curl -sf "${{ steps.url.outputs.target }}/" > /dev/null 2>&1; then
              echo "Deploy healthy after $((i * 5))s"
              break
            fi
            if [ "$i" = "12" ]; then
              echo "Deploy not healthy after 60s"
              exit 1
            fi
            echo "Attempt $i/12 — waiting 5s..."
            sleep 5
          done

      - name: Run smoke tests
        run: bash scripts/smoke-test.sh ${{ steps.url.outputs.target }}

  rollback:
    name: Rollback on failure
    runs-on: ubuntu-latest
    needs: smoke-test
    if: failure() && github.ref_name == 'staging'
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Rollback to previous release
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          echo "Smoke tests failed on staging — rolling back"
          PREV_IMAGE=$(flyctl releases -a surfcontext-staging --json | jq -r '.[1].ImageRef // empty')
          if [ -z "$PREV_IMAGE" ]; then
            echo "No previous release found — cannot rollback"
            exit 1
          fi
          echo "Rolling back to image: $PREV_IMAGE"
          flyctl deploy --image "$PREV_IMAGE" -a surfcontext-staging --wait-timeout 300
          echo "Rollback complete"
